services:
  - type: web
    name: family-fund
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Email через Brevo — задаются в Render → Environment (в репозиторий не попадают)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
