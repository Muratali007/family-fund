# Раз в 10 минут обращаемся к сайту, чтобы бесплатный Render не «усыплял» его
# (засыпает после 15 минут без запросов). Бесплатно для публичных репозиториев.
name: Keep site awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://family-fund-er6w.onrender.com/healthz
